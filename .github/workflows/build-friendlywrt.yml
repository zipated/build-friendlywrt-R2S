name: Build FriendlyWrt

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "源码分支（friendlywrt_manifests）"
        type: choice
        default: master-v25.12
        options:
          - master-v25.12
          - master-v24.10
      board:
        description: "板型配置"
        type: choice
        default: rk3328.mk
        options:
          - rk3328.mk
          - nanopi_r2s.mk
      build_emmc:
        description: "同时生成 eMMC 刷机镜像（eflasher）"
        type: boolean
        default: true
      release_tag:
        description: "Release 标签（留空自动生成）"
        type: string
        default: ""
      lan_ip:
        description: "LAN 管理地址，例如 192.168.2.1（留空不修改）"
        type: string
        default: ""
      lan_netmask:
        description: "LAN 子网掩码，例如 255.255.255.0（留空不修改）"
        type: string
        default: ""
      lan_dns:
        description: "DNS，多个用空格或逗号分隔，例如 223.5.5.5 119.29.29.29（留空不修改）"
        type: string
        default: ""
      wan_proto:
        description: "WAN 协议"
        type: choice
        default: none
        options:
          - none
          - dhcp
          - static
      wan_ip:
        description: "WAN 静态 IP（wan_proto=static 时必填）"
        type: string
        default: ""
      wan_gateway:
        description: "WAN 网关（wan_proto=static 时使用）"
        type: string
        default: ""
  # push:

permissions:
  contents: write

concurrency:
  group: friendlywrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MANIFEST_BRANCH: ${{ inputs.manifest_branch || 'master-v25.12' }}
      BOARD: ${{ inputs.board || 'rk3328.mk' }}
      BUILD_EMMC: ${{ inputs.build_emmc }}
      LAN_IP: ${{ inputs.lan_ip }}
      LAN_NETMASK: ${{ inputs.lan_netmask }}
      LAN_DNS: ${{ inputs.lan_dns }}
      WAN_PROTO: ${{ inputs.wan_proto || 'none' }}
      WAN_IP: ${{ inputs.wan_ip }}
      WAN_GATEWAY: ${{ inputs.wan_gateway }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo swapoff -a || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖（wiki 9.1.2.1）
        # 官方 install.sh 支持 bionic/focal/jammy/noble，会一并安装
        # FriendlyARM 交叉工具链到 /opt/FriendlyARM/toolchain。
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -y update
          sudo apt-get install -y curl wget
          curl -fsSL \
            https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh \
            -o /tmp/fa-install.sh
          chmod +x /tmp/fa-install.sh
          (cd /tmp && sudo -E bash /tmp/fa-install.sh)

          sudo apt-get install -y --no-install-recommends \
            clang llvm lld ccache squashfs-tools dosfstools libfuse3-dev \
            libelf-dev libssl-dev \
            build-essential flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file

          # po2lmo：LuCI 的 .po -> .lmo 翻译编译器，apt 源没有，
          # 从 luci 源码编译（部分第三方 luci-app 会直接调用它）
          git clone --depth 1 -q https://github.com/openwrt/luci.git /tmp/luci-po2lmo
          make -C /tmp/luci-po2lmo/modules/luci-base/src po2lmo CC=cc
          sudo install -m 0755 /tmp/luci-po2lmo/modules/luci-base/src/po2lmo /usr/local/bin/po2lmo
          rm -rf /tmp/luci-po2lmo

          # 官方脚本没有 set -e，个别包缺失不会中断，这里确认关键工具可用
          for c in make gcc g++ flex bison bc cpio rsync parted po2lmo \
            mkfs.ext4 mkfs.exfat mkfs.btrfs simg2img pigz zstd; do
            command -v "$c" >/dev/null || { echo "缺少工具: $c"; exit 1; }
          done

      - name: 配置 git 身份
        run: |
          git config --global user.name "FriendlyWrt CI"
          git config --global user.email "friendlywrt-ci@users.noreply.github.com"
          git config --global color.ui false

      - name: 编译并打包
        run: bash scripts/build.sh

      - name: 生成 Release 标签
        id: release
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            tag="FriendlyWrt-$(date +%Y%m%d-%H%M)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 上传固件到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            FriendlyWrt 自动编译产物

            - 源码分支：`${{ env.MANIFEST_BRANCH }}`
            - 板型配置：`${{ env.BOARD }}`
            - 编译环境：Ubuntu 24.04

            文件说明：

            - `*_sd.img.gz`：SD 卡镜像，解压后写入 TF 卡启动。
            - `*_eflasher.img.gz`：eMMC 刷机镜像，写入 TF 卡启动后把系统刷入 eMMC。
            - `friendlywrt*-images.tgz`：eMMC 刷机助手使用的系统升级包（生成时提供）。
            - `config.txt`：本次编译最终使用的 `.config`。
